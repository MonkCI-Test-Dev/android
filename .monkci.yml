# MonkCI Configuration
# Disable automatic checkov scanning to prevent SARIF directory issues
# Checkov will be handled by repository workflows instead

security-scanning:
  checkov:
    enabled: false
    
# Alternative: configure checkov output handling
# The pre-artifact-capture hook ensures checkov.sarif is always a file
artifact-capture:
  checkov-sarif:
    path: checkov.sarif
